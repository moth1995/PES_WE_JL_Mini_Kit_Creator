id: we10-pes14-style-like
display_name: PES 5 / WE 10 → PES14 Style-Like
result-var: output
commands:
  - command: resize
    source: $pa
    size: [512, 256]
    register-var: pa
  - command: resize
    source: $pb
    size: [512, 256]
    register-var: pb
  - command: crop
    source: $pa
    box: [40, 0, 142, 145]
    register-var: pa_shirt
  - command: crop
    source: $pa
    box: [10, 145, 163, 256]
    register-var: pa_short
  - command: crop
    source: $pa
    box: [370, 0, 489, 82]
    register-var: pa_socks
  - command: crop
    source: $pa
    box: [287, 83, 400, 155]
    register-var: pa_left_sleeve
  - command: crop
    source: $pa
    box: [401, 83, 511, 155]
    register-var: pa_right_sleeve
  - command: rotate
    source: $pa_left_sleeve
    angle: 180
    register-var: pa_left_sleeve
  - command: rotate
    source: $pa_right_sleeve
    angle: 180
    register-var: pa_right_sleeve
  - command: crop
    source: $pb
    box: [40, 0, 142, 145]
    register-var: pb_shirt
  - command: crop
    source: $pb
    box: [10, 145, 163, 256]
    register-var: pb_short
  - command: crop
    source: $pb
    box: [370, 0, 489, 82]
    register-var: pb_socks
  - command: crop
    source: $pb
    box: [287, 83, 400, 155]
    register-var: pb_left_sleeve
  - command: crop
    source: $pb
    box: [401, 83, 511, 155]
    register-var: pb_right_sleeve
  - command: rotate
    source: $pb_left_sleeve
    angle: 180
    register-var: pb_left_sleeve
  - command: rotate
    source: $pb_right_sleeve
    angle: 180
    register-var: pb_right_sleeve
  - command: rotate
    source: $pa_left_sleeve
    angle: -90
    expand: true
    register-var: pa_left_sleeve
  - command: rotate
    source: $pa_right_sleeve
    angle: -90
    expand: true
    register-var: pa_right_sleeve
  - command: rotate
    source: $pb_left_sleeve
    angle: -90
    expand: true
    register-var: pb_left_sleeve
  - command: rotate
    source: $pb_right_sleeve
    angle: -90
    expand: true
    register-var: pb_right_sleeve
  - command: resize
    source: $pa_shirt
    size: [26, 50]
    register-var: pa_shirt
  - command: resize
    source: $pa_short
    size: [33, 26]
    register-var: pa_short
  - command: resize
    source: $pa_socks
    size: [12, 29]
    register-var: pa_socks
  - command: resize
    source: $pa_left_sleeve
    size: [14, 16]
    register-var: pa_left_sleeve
  - command: resize
    source: $pa_right_sleeve
    size: [14, 16]
    register-var: pa_right_sleeve
  - command: resize
    source: $pb_shirt
    size: [26, 50]
    register-var: pb_shirt
  - command: resize
    source: $pb_short
    size: [33, 26]
    register-var: pb_short
  - command: resize
    source: $pb_socks
    size: [12, 29]
    register-var: pb_socks
  - command: resize
    source: $pb_left_sleeve
    size: [14, 16]
    register-var: pb_left_sleeve
  - command: resize
    source: $pb_right_sleeve
    size: [14, 16]
    register-var: pb_right_sleeve
  - command: new-image
    mode: RGBA
    size: [128, 128]
    color: [0, 0, 0, 0]
    register-var: output
  - command: paste
    target: $output
    source: $pa_left_sleeve
    position: [12, 9]
    register-var: output
  - command: paste
    target: $output
    source: $pa_right_sleeve
    position: [39, 9]
    register-var: output
  - command: paste
    target: $output
    source: $pa_shirt
    position: [20, 4]
    register-var: output
  - command: paste
    target: $output
    source: $pa_short
    position: [15, 54]
    register-var: output
  - command: paste
    target: $output
    source: $pa_socks
    position: [39, 85]
    register-var: output
  - command: paste
    target: $output
    source: $pa_socks
    position: [14, 85]
    register-var: output
  - command: paste
    target: $output
    source: $pb_left_sleeve
    position: [76, 9]
    register-var: output
  - command: paste
    target: $output
    source: $pb_right_sleeve
    position: [103, 9]
    register-var: output
  - command: paste
    target: $output
    source: $pb_shirt
    position: [84, 4]
    register-var: output
  - command: paste
    target: $output
    source: $pb_short
    position: [80, 54]
    register-var: output
  - command: paste
    target: $output
    source: $pb_socks
    position: [103, 85]
    register-var: output
  - command: paste
    target: $output
    source: $pb_socks
    position: [78, 85]
    register-var: output
  - command: load-image
    path: resources/new_style_kit_2d_128x128.png
    register-var: mask
  - command: composite
    foreground: $output
    background: $mask
    mask: $mask
    mask-mode: alpha
    register-var: output
  - command: composite
    foreground: $output
    background: $mask
    mask: $mask
    mask-mode: grayscale
    register-var: output
