id: we10-old-style
display_name: PES 5 / WE 10 → Old Style
result-var: output
commands:
  - resize:
      source: $pa
      size: [512, 256]
    register-var: pa
  - resize:
      source: $pb
      size: [512, 256]
    register-var: pb

  - crop:
      source: $pa
      box: [287, 83, 400, 155]
  - rotate:
      angle: 180
  - rotate:
      angle: -45
      expand: true
  - resize:
      size: [18, 18]
    register-var: pa_left_sleeve

  - crop:
      source: $pa
      box: [401, 83, 511, 155]
  - rotate:
      angle: 180
  - rotate:
      angle: -135
      expand: true
  - resize:
      size: [18, 18]
    register-var: pa_right_sleeve

  - crop:
      source: $pa
      box: [40, 0, 142, 145]
  - resize:
      size: [28, 38]
    register-var: pa_shirt

  - crop:
      source: $pa
      box: [10, 145, 163, 256]
  - resize:
      size: [25, 25]
    register-var: pa_short

  - crop:
      source: $pa
      box: [370, 0, 489, 82]
  - resize:
      size: [19, 33]
    register-var: pa_socks

  - crop:
      source: $pb
      box: [287, 83, 400, 155]
  - rotate:
      angle: 180
  - rotate:
      angle: -45
      expand: true
  - resize:
      size: [18, 18]
    register-var: pb_left_sleeve

  - crop:
      source: $pb
      box: [401, 83, 511, 155]
  - rotate:
      angle: 180
  - rotate:
      angle: -135
      expand: true
  - resize:
      size: [18, 18]
    register-var: pb_right_sleeve

  - crop:
      source: $pb
      box: [40, 0, 142, 145]
  - resize:
      size: [28, 38]
    register-var: pb_shirt

  - crop:
      source: $pb
      box: [10, 145, 163, 256]
  - resize:
      size: [25, 25]
    register-var: pb_short

  - crop:
      source: $pb
      box: [370, 0, 489, 82]
  - resize:
      size: [19, 33]
    register-var: pb_socks

  - new-image:
      mode: RGBA
      size: [128, 128]
      color: [0, 0, 0, 0]
  - paste:
      source: $pa_left_sleeve
      position: [29, 2]
  - paste:
      source: $pa_right_sleeve
      position: [1, 2]
  - paste:
      source: $pa_shirt
      position: [10, 1]
  - paste:
      source: $pa_short
      position: [4, 42]
  - paste:
      source: $pa_socks
      position: [6, 75]
  - paste:
      source: $pb_left_sleeve
      position: [77, 2]
  - paste:
      source: $pb_right_sleeve
      position: [47, 2]
  - paste:
      source: $pb_shirt
      position: [58, 1]
  - paste:
      source: $pb_short
      position: [36, 42]
  - paste:
      source: $pb_socks
      position: [39, 75]
    register-var: output

  - load-image:
      path: resources/old_style_kit_2d.png
    register-var: mask
  - composite:
      foreground: $output
      background: $mask
      mask: $mask
      mask-mode: alpha
  - composite:
      background: $mask
      mask: $mask
      mask-mode: grayscale
    register-var: output
