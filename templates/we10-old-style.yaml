id: we10-old-style
display_name: PES 5 / WE 10 → Old Style
result-var: output
commands:
  - resize:
      source: $pa
      size: [512, 256]
    register-var: pa
  - resize:
      source: $pb
      size: [512, 256]
    register-var: pb
  - crop:
      source: $pa
      box: [40, 0, 142, 145]
    register-var: pa_shirt
  - crop:
      source: $pa
      box: [10, 145, 163, 256]
    register-var: pa_short
  - crop:
      source: $pa
      box: [370, 0, 489, 82]
    register-var: pa_socks
  - crop:
      source: $pa
      box: [287, 83, 400, 155]
    register-var: pa_left_sleeve
  - crop:
      source: $pa
      box: [401, 83, 511, 155]
    register-var: pa_right_sleeve
  - rotate:
      source: $pa_left_sleeve
      angle: 180
    register-var: pa_left_sleeve
  - rotate:
      source: $pa_right_sleeve
      angle: 180
    register-var: pa_right_sleeve
  - crop:
      source: $pb
      box: [40, 0, 142, 145]
    register-var: pb_shirt
  - crop:
      source: $pb
      box: [10, 145, 163, 256]
    register-var: pb_short
  - crop:
      source: $pb
      box: [370, 0, 489, 82]
    register-var: pb_socks
  - crop:
      source: $pb
      box: [287, 83, 400, 155]
    register-var: pb_left_sleeve
  - crop:
      source: $pb
      box: [401, 83, 511, 155]
    register-var: pb_right_sleeve
  - rotate:
      source: $pb_left_sleeve
      angle: 180
    register-var: pb_left_sleeve
  - rotate:
      source: $pb_right_sleeve
      angle: 180
    register-var: pb_right_sleeve
  - rotate:
      source: $pa_left_sleeve
      angle: -45
      expand: true
    register-var: pa_left_sleeve
  - rotate:
      source: $pa_right_sleeve
      angle: -135
      expand: true
    register-var: pa_right_sleeve
  - rotate:
      source: $pb_left_sleeve
      angle: -45
      expand: true
    register-var: pb_left_sleeve
  - rotate:
      source: $pb_right_sleeve
      angle: -135
      expand: true
    register-var: pb_right_sleeve
  - resize:
      source: $pa_shirt
      size: [28, 38]
    register-var: pa_shirt
  - resize:
      source: $pa_short
      size: [25, 25]
    register-var: pa_short
  - resize:
      source: $pa_socks
      size: [19, 33]
    register-var: pa_socks
  - resize:
      source: $pa_left_sleeve
      size: [18, 18]
    register-var: pa_left_sleeve
  - resize:
      source: $pa_right_sleeve
      size: [18, 18]
    register-var: pa_right_sleeve
  - resize:
      source: $pb_shirt
      size: [28, 38]
    register-var: pb_shirt
  - resize:
      source: $pb_short
      size: [25, 25]
    register-var: pb_short
  - resize:
      source: $pb_socks
      size: [19, 33]
    register-var: pb_socks
  - resize:
      source: $pb_left_sleeve
      size: [18, 18]
    register-var: pb_left_sleeve
  - resize:
      source: $pb_right_sleeve
      size: [18, 18]
    register-var: pb_right_sleeve
  - new-image:
      mode: RGBA
      size: [128, 128]
      color: [0, 0, 0, 0]
    register-var: output
  - paste:
      target: $output
      source: $pa_left_sleeve
      position: [29, 2]
    register-var: output
  - paste:
      target: $output
      source: $pa_right_sleeve
      position: [1, 2]
    register-var: output
  - paste:
      target: $output
      source: $pa_shirt
      position: [10, 1]
    register-var: output
  - paste:
      target: $output
      source: $pa_short
      position: [4, 42]
    register-var: output
  - paste:
      target: $output
      source: $pa_socks
      position: [6, 75]
    register-var: output
  - paste:
      target: $output
      source: $pb_left_sleeve
      position: [77, 2]
    register-var: output
  - paste:
      target: $output
      source: $pb_right_sleeve
      position: [47, 2]
    register-var: output
  - paste:
      target: $output
      source: $pb_shirt
      position: [58, 1]
    register-var: output
  - paste:
      target: $output
      source: $pb_short
      position: [36, 42]
    register-var: output
  - paste:
      target: $output
      source: $pb_socks
      position: [39, 75]
    register-var: output
  - load-image:
      path: resources/old_style_kit_2d.png
    register-var: mask
  - composite:
      foreground: $output
      background: $mask
      mask: $mask
      mask-mode: alpha
    register-var: output
  - composite:
      foreground: $output
      background: $mask
      mask: $mask
      mask-mode: grayscale
    register-var: output
