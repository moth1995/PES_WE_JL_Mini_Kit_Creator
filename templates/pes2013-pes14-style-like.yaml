id: pes2013-pes14-style-like
display_name: PES 2013 → PES14 Style-Like
result-var: output
commands:
  - resize:
      source: $pa
      size: [512, 256]
    register-var: pa
  - resize:
      source: $pb
      size: [512, 256]
    register-var: pb

  - new-image:
      mode: RGBA
      size: [128, 128]
      color: [0, 0, 0, 0]
    register-var: canvas

  - crop:
      source: $pa
      box: [287, 83, 400, 155]
  - rotate:
      angle: 180
  - rotate:
      angle: -90
      expand: true
  - resize:
      size: [14, 16]
  - paste:
      target: $canvas
      position: [12, 9]
    register-var: canvas

  - crop:
      source: $pa
      box: [401, 83, 511, 155]
  - rotate:
      angle: 180
  - rotate:
      angle: -90
      expand: true
  - resize:
      size: [14, 16]
  - paste:
      target: $canvas
      position: [39, 9]
    register-var: canvas

  - crop:
      source: $pa
      box: [40, 0, 142, 145]
  - resize:
      size: [26, 50]
  - paste:
      target: $canvas
      position: [20, 4]
    register-var: canvas

  - crop:
      source: $pa
      box: [10, 145, 163, 256]
  - resize:
      size: [33, 26]
  - paste:
      target: $canvas
      position: [15, 54]
    register-var: canvas

  - crop:
      source: $pa
      box: [370, 0, 489, 82]
  - resize:
      size: [12, 29]
    register-var: pa_socks
  - paste:
      target: $canvas
      position: [39, 85]
    register-var: canvas
  - paste:
      source: $pa_socks
      target: $canvas
      position: [14, 85]
    register-var: canvas

  - crop:
      source: $pb
      box: [287, 83, 400, 155]
  - rotate:
      angle: 180
  - rotate:
      angle: -90
      expand: true
  - resize:
      size: [14, 16]
  - paste:
      target: $canvas
      position: [76, 9]
    register-var: canvas

  - crop:
      source: $pb
      box: [401, 83, 511, 155]
  - rotate:
      angle: 180
  - rotate:
      angle: -90
      expand: true
  - resize:
      size: [14, 16]
  - paste:
      target: $canvas
      position: [103, 9]
    register-var: canvas

  - crop:
      source: $pb
      box: [40, 0, 142, 145]
  - resize:
      size: [26, 50]
  - paste:
      target: $canvas
      position: [84, 4]
    register-var: canvas

  - crop:
      source: $pb
      box: [10, 145, 163, 256]
  - resize:
      size: [33, 26]
  - paste:
      target: $canvas
      position: [80, 54]
    register-var: canvas

  - crop:
      source: $pb
      box: [370, 0, 489, 82]
  - resize:
      size: [12, 29]
    register-var: pb_socks
  - paste:
      target: $canvas
      position: [103, 85]
    register-var: canvas
  - paste:
      source: $pb_socks
      target: $canvas
      position: [78, 85]
    register-var: output

  - load-image:
      path: resources/new_style_kit_2d_128x128.png
    register-var: mask
  - composite:
      foreground: $output
      background: $mask
      mask: $mask
      mask-mode: alpha
  - composite:
      background: $mask
      mask: $mask
      mask-mode: grayscale
    register-var: output
