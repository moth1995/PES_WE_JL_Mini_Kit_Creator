id: pes2013-old-style
display_name: PES 2013 → Old Style
result-var: output
commands:
  - resize:
      source: $pa
      size: [512, 256]
    register-var: pa
  - resize:
      source: $pb
      size: [512, 256]
    register-var: pb

  - new-image:
      mode: RGBA
      size: [128, 128]
      color: [0, 0, 0, 0]
    register-var: canvas

  - crop:
      source: $pa
      box: [432, 93, 512, 188]
  - flip:
      direction: horizontal
  - rotate:
      angle: -45
      expand: true
  - resize:
      size: [18, 18]
  - paste:
      target: $canvas
      position: [29, 2]
    register-var: canvas

  - crop:
      source: $pa
      box: [432, 93, 512, 188]
  - rotate:
      angle: -135
      expand: true
  - resize:
      size: [18, 18]
  - paste:
      target: $canvas
      position: [1, 2]
    register-var: canvas

  - crop:
      source: $pa
      box: [40, 0, 154, 143]
  - resize:
      size: [28, 38]
  - paste:
      target: $canvas
      position: [10, 1]
    register-var: canvas

  - crop:
      source: $pa
      box: [22, 143, 172, 256]
  - resize:
      size: [25, 25]
  - paste:
      target: $canvas
      position: [4, 42]
    register-var: canvas

  - crop:
      source: $pa
      box: [413, 188, 511, 255]
  - resize:
      size: [19, 33]
  - paste:
      target: $canvas
      position: [6, 75]
    register-var: canvas

  - crop:
      source: $pb
      box: [432, 93, 512, 188]
  - flip:
      direction: horizontal
  - rotate:
      angle: -45
      expand: true
  - resize:
      size: [18, 18]
  - paste:
      target: $canvas
      position: [77, 2]
    register-var: canvas

  - crop:
      source: $pb
      box: [432, 93, 512, 188]
  - rotate:
      angle: -135
      expand: true
  - resize:
      size: [18, 18]
  - paste:
      target: $canvas
      position: [47, 2]
    register-var: canvas

  - crop:
      source: $pb
      box: [40, 0, 154, 143]
  - resize:
      size: [28, 38]
  - paste:
      target: $canvas
      position: [58, 1]
    register-var: canvas

  - crop:
      source: $pb
      box: [22, 143, 172, 256]
  - resize:
      size: [25, 25]
  - paste:
      target: $canvas
      position: [36, 42]
    register-var: canvas

  - crop:
      source: $pb
      box: [413, 188, 511, 255]
  - resize:
      size: [19, 33]
  - paste:
      target: $canvas
      position: [39, 75]
    register-var: output

  - load-image:
      path: resources/old_style_kit_2d.png
    register-var: mask
  - composite:
      foreground: $output
      background: $mask
      mask: $mask
      mask-mode: alpha
  - composite:
      background: $mask
      mask: $mask
      mask-mode: grayscale
    register-var: output
